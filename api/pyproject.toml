[project]
name = "si-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.119.0", "pydantic==2.12.3", "sqlalchemy==2.0.44",
  "alembic==1.17.0", "psycopg[binary]==3.2.12", "pgvector==0.4.1",
  "redis==5.2.1", "arq==0.26.3", "httpx==0.28.1",
  "python-multipart==0.0.30", "pypdf==6.19.0", "beautifulsoup4==4.14.2",
  "jsonschema==4.25.1", "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.1", "mypy==1.18.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["si"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
