name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: si
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: si_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U si -d si_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      REDIS_URL: redis://localhost:6379/0
      SI_TEST_REDIS_URL: redis://localhost:6379/1
      SI_BOOTSTRAP_KEY: ci-local-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          echo "DATABASE_URL=postgresql+psycopg://si:${POSTGRES_PASSWORD}@localhost:5432/si_test" >> "$GITHUB_ENV"
          echo "SI_TEST_DATABASE_URL=postgresql+psycopg://si:${POSTGRES_PASSWORD}@localhost:5432/si_test" >> "$GITHUB_ENV"
      - run: pip install uv==0.13.1
      - run: uv sync --frozen
        working-directory: api
      - run: uv run ruff check si tests
        working-directory: api
      - run: uv run mypy si
        working-directory: api
      - run: uv run alembic upgrade head && uv run pytest -q
        working-directory: api
      - run: uv sync --frozen && uv run ruff check . && uv run mypy src && uv run pytest -q
        working-directory: sdk/python

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:8000/health/ready && curl --fail --output /dev/null http://localhost:3000
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
