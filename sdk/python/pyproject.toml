[project]
name = "si-sdk"
version = "0.1.0"
description = "Python client and CLI for Super Intelligence"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1"]

[project.scripts]
si = "si_sdk.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0", "mypy==1.18.2"]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
